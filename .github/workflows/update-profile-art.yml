name: profile art

# Refreshes the animated contribution graph (assets/contrib-heatmap.svg) from
# real data once a day. The ASCII portrait and 3D wordmark are static and are
# only regenerated by hand -- see docs/profile-art.md.

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily, after the snake + wakatime jobs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # both scripts are stdlib-only, so there is nothing to pip install
      - name: Fetch contribution data (public, no token needed)
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Render contribution skyline
        run: python scripts/render_skyline_svg.py

      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg assets/contrib-skyline.svg
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: refresh contribution graph [skip ci]"
          for i in 1 2 3; do git push && break || git pull --rebase origin main; done
